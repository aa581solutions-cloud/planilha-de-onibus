<!doctype html><html lang="pt-BR"><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sistema de Viagens — AASolution</title><style>:root{--bg:#07111f;--panel:#0e2035;--line:#24435f;--text:#eef7ff;--muted:#9bb1c7;--accent:#45c9ff;--free:#1f9d62;--busy:#c94343}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1100px;margin:auto;padding:18px}.cards,.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.grid{grid-template-columns:repeat(2,1fr)}.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}.number{font-size:32px;font-weight:800;color:var(--accent)}.muted,label{color:var(--muted)}input,select,button{padding:11px;border-radius:9px;border:1px solid var(--line);background:#102a45;color:#fff}input,select{width:100%}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.vehicle{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:12px 0}.seatmap{max-width:390px;margin:16px auto;background:#0a1929;border:2px solid var(--line);border-radius:42px 42px 18px 18px;padding:34px 18px 18px}.seats{display:grid;grid-template-columns:1fr 1fr 34px 1fr 1fr;gap:8px}.seat{min-height:45px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:700}.free{background:var(--free)}.busy{background:var(--busy)}.preferential{outline:2px solid #ffd166}.aisle{grid-column:3}@media(max-width:700px){.cards,.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><h2>SISTEMA DE VIAGENS — AASolution</h2><div class="muted" id="tripTitle">Carregando viagem...</div><section class="cards"><div class="card">PASSAGEIROS<div class="number" id="passengers">—</div></div><div class="card">CAPACIDADE<div class="number" id="capacity">—</div></div><div class="card">VAGAS LIVRES<div class="number" id="freeCount">—</div></div></section><section class="section"><h2>Dados da viagem</h2><div class="grid"><div><label>Nome da viagem</label><input id="tripName"></div><div><label>Congregação</label><input id="congregation"></div><div><label>Origem</label><input id="origin"></div><div><label>Destino</label><input id="destination"></div><div><label>Data de ida</label><input id="dateOut" type="date"></div><div><label>Data de retorno</label><input id="dateBack" type="date"></div></div><div class="row"><button>Salvar dados da viagem</button></div></section><section class="section"><h2>Transportes e capacidade</h2><div id="vehicles"></div><div class="row"><button>+ Ônibus</button><button>+ Van</button><button>+ Carro</button></div></section><section class="section"><h2>Participantes e assentos</h2><div class="grid"><div><label>Pesquisar participante</label><input placeholder="Digite o nome..."></div><div><label>Veículo</label><select id="vehicleSelect" onchange="loadSeats(this.value)"><option value="">Selecione</option></select></div></div><div class="row"><button>Adicionar participante</button><button>Editar cadastro geral</button><button>Distribuir automaticamente</button></div><div id="seatArea" class="seatmap"><div class="muted">Selecione um veículo para ver o mapa.</div></div></section><section class="section"><h2>Pagamentos, passagem e relatórios</h2><div class="row"><button>Pagamentos</button><button>Prévia da passagem</button><button>Enviar via WhatsApp</button><button>Prévia da lista</button><button>Relatório da Empresa</button><button>Lista do Capitão</button><button>Placa A4</button></div></section><section class="section"><h2>Aparência</h2><div class="grid"><input id="bgColor" type="color" value="#07111f" onchange="document.body.style.backgroundColor=this.value"><input id="bgImage" placeholder="URL de imagem de fundo (opcional)"></div><div class="row"><button onclick="applyBackground()">Aplicar fundo</button></div></section></main><script>let appData=null;google.script.run.withSuccessHandler(init).withFailureHandler(showError).getAppData();function init(d){appData=d;tripTitle.textContent=d.nome;passengers.textContent=d.participantes;capacity.textContent=d.capacidade;freeCount.textContent=d.vagasLivres;tripName.value=d.nome||'';congregation.value=d.congregacao||'';vehicles.innerHTML=(d.veiculos||[]).map(v=>`<div class="vehicle"><span><b>${v['Identificação']}</b><br><small>${v['Tipo']} · ${v['Capacidade']} lugares</small></span><button onclick='selectVehicle(${JSON.stringify(v["Identificação"])})'>Ver mapa</button></div>`).join('');vehicleSelect.innerHTML='<option value="">Selecione</option>'+(d.veiculos||[]).map(v=>`<option>${v['Identificação']}</option>`).join('')}function selectVehicle(n){vehicleSelect.value=n;loadSeats(n)}function loadSeats(v){if(!v)return;seatArea.innerHTML='<div class="muted">Carregando...</div>';google.script.run.withSuccessHandler(renderSeats).withFailureHandler(showError).getSeats(v)}function renderSeats(a){let h='<div class="seats">';a.forEach((s,i)=>{if(i%4===2)h+='<div class="aisle"></div>';let o=String(s.Status).toLowerCase()!=='livre',p=s.Preferencial===true||String(s.Preferencial).toUpperCase()==='TRUE';h+=`<div class="seat ${o?'busy':'free'} ${p?'preferential':''}" title="${o?(s.Nome||'Ocupado'):'Livre'}">${s.Lugar}</div>`});seatArea.innerHTML=h+'</div><p class="muted">Verde = livre · Vermelho = ocupado · contorno amarelo = preferencial</p>'}function applyBackground(){let u=bgImage.value.trim();document.body.style.backgroundImage=u?`url("${u.replace(/"/g,'')}")`:'none';document.body.style.backgroundSize='cover'}function showError(e){seatArea.innerHTML='<div class="muted">Erro: '+(e.message||e)+'</div>'}</script></body></html>
