<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--blue:#1769aa;--navy:#15385b;--line:#d8e4f1;--bg:#f2f6fb;--muted:#63758b}
    *{box-sizing:border-box}body{font:13px Arial,sans-serif;margin:0;padding:14px;background:var(--bg);color:var(--navy)}
    header,.panel{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;margin-bottom:11px}
    header h2{font-size:17px;margin:0 0 5px}p{color:var(--muted);line-height:1.4;margin:5px 0}
    h3{font-size:14px;margin:0 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .stat{background:#edf4fc;padding:10px;border-radius:8px}.num{font-size:22px;font-weight:bold;color:var(--blue)}
    label{display:block;font-weight:600;margin:9px 0 4px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd8e7;border-radius:7px;background:white;color:#183153}
    button{border:0;border-radius:7px;background:var(--blue);color:#fff;padding:9px 12px;font-weight:600;cursor:pointer;margin-top:10px}
    button.secondary{background:#e8f0f8;color:var(--navy)}.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:16px}
    .row{display:flex;gap:7px}.row>*{flex:1;min-width:0}.hidden{display:none}
    nav{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0}nav button{margin:0;padding:7px 9px;font-size:11px}
    .list{font-size:12px;line-height:1.5;color:var(--muted);max-height:420px;overflow:auto}.report-document{background:#fff;padding:14px;border:1px solid var(--line);color:#183153}.report-document h2{font-size:18px}.report-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}.report-table th,.report-table td{border:1px solid #d8e4f1;padding:6px;text-align:left}.report-table th{background:#eaf2fa}.report-kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:12px 0}.report-kpis div{background:#edf4fc;padding:9px;border-radius:6px}.report-kpis b,.report-kpis span{display:block}.report-kpis b{font-size:18px;color:#1769aa}
  </style>
</head>
<body>
  <header>
    <h2>Planilha de Ônibus — Betel 90</h2>
    <p>Área de operação inicial. A estrutura começa vazia. Os dados são cadastrados manualmente.</p>
    <button class="secondary" onclick="prepare()">Preparar / verificar estrutura</button>
    <div id="globalStatus" class="status"></div>
  </header>
  <section class="panel">
    <h3>Resumo</h3><div class="grid" id="stats"><div class="stat">Carregando...</div></div>
  </section>
  <nav>
    <button onclick="show('person')">Pessoas</button>
    <button onclick="show('trip')">Viagens</button>
    <button onclick="show('enroll')">Inscrições</button>
    <button onclick="show('vehicle')">Veículos</button>
    <button onclick="show('payment')">Pagamentos</button>
    <button onclick="show('seats')">Assentos</button>
    <button onclick="show('reports')">Relatórios</button>
  </nav>
  <section id="person" class="panel">
    <h3>Novo cadastro de pessoa</h3>
    <form onsubmit="submitPerson(event)">
      <label>Nome completo *</label><input name="nome" required>
      <label>Telefone</label><input name="telefone" placeholder="Opcional">
      <label>Observações</label><textarea name="observacoes" rows="2"></textarea>
      <button type="submit">Cadastrar pessoa</button>
    </form><div id="personStatus" class="status"></div>
  </section>
  <section id="trip" class="panel hidden">
    <h3>Nova viagem</h3>
    <form onsubmit="submitTrip(event)">
      <label>Nome da viagem *</label><input name="nome" required>
      <div class="row"><div><label>Data de ida *</label><input type="date" name="dataIda" required></div><div><label>Data de retorno</label><input type="date" name="dataRetorno"></div></div>
      <label>Destino</label><input name="destino">
      <label>Observações</label><textarea name="observacoes" rows="2"></textarea>
      <button type="submit">Cadastrar viagem</button>
    </form><div id="tripStatus" class="status"></div>
  </section>
  <section id="enroll" class="panel hidden">
    <h3>Inscrever pessoa na viagem</h3>
    <label>Viagem *</label><select id="enrollTrip" required></select>
    <label>Pessoa *</label><select id="enrollPerson" required></select>
    <label>Valor previsto da passagem</label><input id="expected" type="number" min="0" step="0.01" value="0">
    <button onclick="enroll()">Confirmar inscrição</button><div id="enrollStatus" class="status"></div>
  </section>
  <section id="vehicle" class="panel hidden">
    <h3>Cadastrar veículo</h3>
    <label>Viagem *</label><select id="vehicleTrip" required></select>
    <label>Tipo *</label><select id="vehicleType"><option>Ônibus</option><option>Van</option><option>Carro</option><option>Outro</option></select>
    <label>Identificação *</label><input id="vehicleName" placeholder="Ex.: Ônibus 1" required>
    <label>Quantidade de assentos *</label><input id="vehicleCapacity" type="number" min="1" step="1" required>
    <button onclick="createVehicle()">Cadastrar veículo e gerar assentos</button><div id="vehicleStatus" class="status"></div>
  </section>
  <section id="payment" class="panel hidden">
    <h3>Registrar pagamento</h3>
    <label>Viagem *</label><select id="paymentTrip" onchange="loadParticipants()" required></select>
    <label>Participante *</label><select id="paymentParticipant" required></select>
    <div class="row"><div><label>Data *</label><input id="paymentDate" type="date" required></div><div><label>Valor *</label><input id="paymentAmount" type="number" min="0.01" step="0.01" required></div></div>
    <label>Forma de pagamento</label><input id="paymentMethod" placeholder="Dinheiro, PIX, transferência...">
    <button onclick="registerPayment()">Salvar pagamento</button><div id="paymentStatus" class="status"></div>
  </section>
  <section id="seats" class="panel hidden"><h3>Mapa de assentos</h3><label>Viagem *</label><select id="seatTrip" onchange="loadSeatMap()" required></select><label>Participante *</label><select id="seatParticipant" required></select><label>Veículo e assento livre *</label><select id="seatChoice" required></select><button onclick="assignSeat()">Atribuir assento</button><div id="seatMap" class="list"></div><div id="seatStatus" class="status"></div></section>
  <section id="reports" class="panel hidden"><h3>Resumo e listas</h3><label>Viagem *</label><select id="reportTrip" required></select><button onclick="previewReport()">Pré-visualizar relatório</button><div id="reportArea" class="list"></div><button class="secondary" onclick="printReport()">Imprimir / salvar PDF</button></section>
  <script>
    let reportHtml = '';
    function show(id){['person','trip','enroll','vehicle','payment','seats','reports'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));}
    function msg(id,text){document.getElementById(id).textContent=text;}
    function esc(v){const el=document.createElement('div');el.textContent=String(v==null?'':v);return el.innerHTML;}
    function call(name,args,statusId,done){
      const runner=google.script.run.withSuccessHandler(r=>{msg(statusId,'Concluído. '+(r&&r.id?'Código: '+r.id:''));if(done)done(r);refresh();})
        .withFailureHandler(e=>msg(statusId,'Não foi possível concluir: '+e.message));
      runner[name](args);
    }
    function prepare(){google.script.run.withSuccessHandler(()=>{msg('globalStatus','Estrutura verificada; nenhum cadastro foi criado.');refresh();})
      .withFailureHandler(e=>msg('globalStatus',e.message)).setupBetel90();}
    function submitPerson(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());call('addPerson',d,'personStatus',()=>e.target.reset());}
    function submitTrip(e){e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());call('addTrip',d,'tripStatus',()=>e.target.reset());}
    function fill(id,items,placeholder){const el=document.getElementById(id);const old=el.value;el.innerHTML='<option value="">'+placeholder+'</option>'+items.map(x=>'<option value="'+x.id+'">'+esc(x.nome)+'</option>').join('');if(items.some(x=>x.id===old))el.value=old;}
    function refresh(){
      google.script.run.withSuccessHandler(d=>{
        document.getElementById('stats').innerHTML=[['Pessoas',d.people],['Viagens',d.trips],['Inscrições',d.participants],['Pagamentos',d.payments],['Veículos',d.vehicles]]
          .map(x=>'<div class="stat"><div class="num">'+x[1]+'</div>'+x[0]+'</div>').join('');
      }).getAppSummary();
      google.script.run.withSuccessHandler(p=>fill('enrollPerson',p,'Selecione uma pessoa')).listPeople();
      google.script.run.withSuccessHandler(t=>{fill('enrollTrip',t,'Selecione uma viagem');fill('vehicleTrip',t,'Selecione uma viagem');fill('paymentTrip',t,'Selecione uma viagem');fill('seatTrip',t,'Selecione uma viagem');fill('reportTrip',t,'Selecione uma viagem');}).listTrips();
    }
    function enroll(){call('enrollParticipant',{viagemId:document.getElementById('enrollTrip').value,pessoaId:document.getElementById('enrollPerson').value,valorPrevisto:document.getElementById('expected').value},'enrollStatus');}
    function createVehicle(){call('createVehicle',{viagemId:document.getElementById('vehicleTrip').value,tipo:document.getElementById('vehicleType').value,identificacao:document.getElementById('vehicleName').value,capacidade:document.getElementById('vehicleCapacity').value},'vehicleStatus');}
    function loadParticipants(){const id=document.getElementById('paymentTrip').value;google.script.run.withSuccessHandler(p=>{const el=document.getElementById('paymentParticipant');el.innerHTML='<option value="">Selecione</option>'+p.map(x=>'<option value="'+x.id+'"'>'+esc(x.nome)+'</option>').join('');}).listParticipants(id);}
    function registerPayment(){call('registerPayment',{participacaoId:document.getElementById('paymentParticipant').value,data:document.getElementById('paymentDate').value,valor:document.getElementById('paymentAmount').value,forma:document.getElementById('paymentMethod').value},'paymentStatus');}
    function loadSeatMap(){const trip=document.getElementById('seatTrip').value;google.script.run.withSuccessHandler(p=>{const el=document.getElementById('seatParticipant');el.innerHTML='<option value="">Selecione</option>'+p.map(x=>'<option value="'+x.id+'">'+esc(x.nome)+'</option>').join('');}).listParticipants(trip);google.script.run.withSuccessHandler(s=>{const free=s.filter(x=>x.status==='LIVRE');document.getElementById('seatChoice').innerHTML='<option value="">Selecione veículo/assento</option>'+free.map(x=>'<option value="'+x.veiculoId+'|'+x.numero+'">'+esc(x.veiculo)+' — assento '+x.numero+'</option>').join('');document.getElementById('seatMap').innerHTML=s.map(x=>esc(x.veiculo)+' / '+x.numero+': '+(x.status==='OCUPADO'?esc(x.passageiro):'Livre')).join('<br>');}).getSeatMap(trip);}
    function assignSeat(){const choice=document.getElementById('seatChoice').value.split('|');if(choice.length!==2){msg('seatStatus','Selecione um assento livre.');return;}call('assignSeat',{participacaoId:document.getElementById('seatParticipant').value,veiculoId:choice[0],numeroAssento:choice[1]},'seatStatus',loadSeatMap);}
    function loadReportParticipants(){const id=document.getElementById('reportTrip').value;google.script.run.withSuccessHandler(p=>{const el=document.getElementById('reportParticipant');el.innerHTML='<option value="">Selecione um participante</option>'+p.map(x=>'<option value="'+x.id+'">'+esc(x.nome)+' — '+esc(x.status)+'</option>').join('');}).listParticipants(id);}
    function updateParticipantStatus(){const id=document.getElementById('reportParticipant').value,status=document.getElementById('participantStatus').value;google.script.run.withSuccessHandler(()=>{msg('reportArea','Situação do passageiro atualizada.');loadReportParticipants();}).withFailureHandler(e=>msg('reportArea',e.message)).setParticipantStatus(id,status);}
    function previewReport(){
      const trip=document.getElementById('reportTrip').value,type=document.getElementById('reportType').value;
      google.script.run.withSuccessHandler(r=>{
        const money=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
        const head='<h2>'+esc(r.title)+'</h2><p><b>'+esc(r.trip.nome)+'</b> — '+esc(r.trip.destino)+' — '+esc(r.trip.dataIda)+'</p>';
        let body='';
        if(type==='resumo'){
          body='<div class="report-kpis">'+[['Participantes',r.totals.participantes],['Confirmados',r.totals.confirmados],['Veículos',r.totals.veiculos],['Capacidade',r.totals.capacidade],['Ocupados',r.totals.ocupados],['Livres',r.totals.livres]].map(x=>'<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')+'</div><h3>Financeiro</h3><p>Previsto: '+money(r.totals.previsto)+' | Pago: '+money(r.totals.pago)+' | Saldo: '+money(r.totals.saldo)+'</p><h3>Veículos</h3>'+reportTable(['Veículo','Tipo','Capacidade','Ocupados','Livres'],r.vehicles.map(v=>[v.nome,v.tipo,v.capacidade,v.ocupados,v.livres]));
        }else if(type==='pagamentos'){
          body='<p>Previsto: '+money(r.totals.previsto)+' | Pago: '+money(r.totals.pago)+' | Saldo: '+money(r.totals.saldo)+'</p>'+reportTable(['Participante','Data','Valor','Forma','Referência'],r.paymentDetails.map(p=>[p.nome,p.data,money(p.valor),p.forma,p.referencia]));
        }else{
          const captain=type==='veiculo'||type==='capitao';
          const headers=captain?['Veículo','Assento','Passageiro','Telefone','Situação']:['Participante','Telefone','Situação','Veículo','Assento','Previsto','Pago','Saldo'];
          const rows=r.rows.map(p=>captain?[p.veiculo,p.assento,p.nome,p.telefone,p.status]:[p.nome,p.telefone,p.status,p.veiculo,p.assento,money(p.previsto),money(p.pago),money(p.saldo)]);
          body=(type==='capitao'?'<p>Relação para conferência de embarque, organizada por veículo e assento.</p>':'')+reportTable(headers,rows);
          if(type==='confirmados'&&!rows.length) body='<p>Nenhum passageiro está marcado como confirmado.</p>';
        }
        reportHtml='<article class="report-document">'+head+body+'<footer>Betel 90 • Documento gerado em '+new Date().toLocaleString('pt-BR')+'</footer></article>';
        document.getElementById('reportArea').innerHTML=reportHtml;
      }).withFailureHandler(e=>msg('reportArea',e.message)).getReportData(trip,type);
    }
    function reportTable(headers,rows){
      return '<table class="report-table"><thead><tr>'+headers.map(x=>'<th>'+esc(x)+'</th>').join('')+'</tr></thead><tbody>'+
        (rows.length?rows.map(row=>'<tr>'+row.map(v=>'<td>'+esc(v==null?'—':v)+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+headers.length+'">Nenhum registro para exibir.</td></tr>')+'</tbody></table>';
    }
    function printReport(){
      if(!reportHtml){msg('reportArea','Gere a pré-visualização antes de imprimir.');return;}
      const orientation=document.getElementById('orientation').value,w=window.open('','_blank');
      if(!w){msg('reportArea','Permita a abertura de janelas para imprimir o documento.');return;}
      w.document.write('<!doctype html><html><head><title>Betel 90 — Relatório</title><style>'+
        '@page{size:A4 '+orientation+';margin:14mm}body{font:11px Arial,sans-serif;color:#183153;margin:0}h2{color:#1769aa;margin:0 0 6px}h3{margin:18px 0 7px}.report-table{width:100%;border-collapse:collapse;margin-top:10px;font-size:10px}.report-table th,.report-table td{border:1px solid #cbd8e7;padding:6px;text-align:left}.report-table th{background:#eaf2fa}.report-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:16px 0}.report-kpis div{border:1px solid #d8e4f1;padding:10px}.report-kpis b,.report-kpis span{display:block}.report-kpis b{font-size:18px;color:#1769aa}.report-document footer{margin-top:24px;border-top:1px solid #ddd;padding-top:8px;color:#63758b;font-size:9px}tr{break-inside:avoid}'+
        '</style></head><body>'+reportHtml+'</body></html>');
      w.document.close();w.focus();w.print();
    }
    refresh();
  </script>
</body>
</html>
