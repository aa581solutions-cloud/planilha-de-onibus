<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font:14px Arial,sans-serif;margin:0;padding:18px;background:#f3f7fc;color:#183153}
    .card{background:#fff;border:1px solid #d9e4f2;border-radius:12px;padding:16px;margin-bottom:12px}
    h2{font-size:18px;margin:0 0 8px}p{color:#61738a;line-height:1.45}
    .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .stat{background:#edf4fc;border-radius:9px;padding:12px}
    .num{font-size:24px;font-weight:700;color:#1769aa}
    button{background:#1769aa;color:white;border:0;border-radius:8px;padding:10px 14px;cursor:pointer}
    small{color:#61738a}
  </style>
</head>
<body>
  <section class="card">
    <h2>Planilha de Ônibus — Betel 90</h2>
    <p>Painel inicial de operação. Os cadastros começam vazios. A interface visual definitiva será ajustada para corresponder fielmente à prévia aprovada.</p>
    <button onclick="google.script.run.withSuccessHandler(load).setupBetel90()">Verificar estrutura</button>
  </section>
  <section class="card">
    <h2>Resumo</h2>
    <div class="stats" id="stats"><small>Carregando...</small></div>
  </section>
  <script>
    function load(){
      google.script.run.withSuccessHandler(data=>{
        document.getElementById('stats').innerHTML=[
          ['Pessoas',data.people],['Viagens',data.trips],
          ['Inscrições',data.participants],['Pagamentos',data.payments],
          ['Veículos',data.vehicles]
        ].map(x=>'<div class="stat"><div class="num">'+x[1]+'</div><div>'+x[0]+'</div></div>').join('');
      }).getAppSummary();
    }
    load();
  </script>
</body>
</html>
