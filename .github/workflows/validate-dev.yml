name: Validar DEV
on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'dev/**'
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validar sintaxe Apps Script, JavaScript da interface e manifesto
        run: node scripts/check-syntax.mjs
